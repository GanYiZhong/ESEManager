# Build the Linux package (PyInstaller onedir) and attach it to a GitHub release.
# Runs automatically when a release is published, or manually for an existing tag.

name: Release (Linux)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v1.1.9)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Older Ubuntu = older glibc, so the binary runs on more distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Qt's xcb platform plugin needs these at runtime (also used for the smoke test).
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libegl1
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/ESEManager.spec

      - name: Add databases and docs
        run: |
          out=dist/ESEManager
          cp README.md README.zh-TW.md "$out/"
          for f in ese_songs.db ese_local.db; do curl -fsSL -o "$out/$f" "${PAGES_URL}$f"; done
          curl -fsSL "${PAGES_URL}version.txt" | tr -d '\n' > "$out/version.txt"
          ls -la "$out"

      - name: Smoke test
        # Run from a copy: the app creates config.toml / Downloads next to the exe.
        run: |
          cp -r dist/ESEManager "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          ./ESEManager --selftest-dan
          # Start the GUI headless; it should still be running after 20s (timeout -> 124).
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 ./ESEManager
          rc=$?
          set -e
          echo "GUI exit code: $rc"
          test "$rc" = "124"

      - name: Package
        run: |
          name="ESEManager_${TAG}_linux-x86_64.tar.gz"
          tar -C dist -czf "$name" ESEManager
          ls -la "$name"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
