# Rolling releases for ESEManager.
#
# - push to main that changes the app (src/, packaging/, assets/, requirements):
#   test, build Windows + Linux, then publish a new release automatically,
#   versioned by date: v2026.11.18, then v2026.11.18.2, ... (Asia/Taipei date).
#   Put "[skip release]" in the commit's first line to build without publishing.
# - pull request: test and build only.
# - manual run: with a tag, rebuild that tag and replace its assets; without
#   one, publish a new release from main (e.g. after a workflow-only change).

name: Release builds

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "assets/**"
      - "scripts/fetch_release_dbs.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - "assets/**"
      - "scripts/fetch_release_dbs.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and re-upload (e.g. v2026.11.18). Leave empty to publish a new release from main."
        required: false
        default: ""

permissions:
  contents: write

# One release run at a time on main, so two pushes never pick the same version.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0
          pip install -r requirements-build.txt pytest
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  version:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      mode: ${{ steps.v.outputs.mode }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            git rev-parse -q --verify "refs/tags/$INPUT_TAG" > /dev/null \
              || { echo "::error::tag $INPUT_TAG does not exist"; exit 1; }
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "mode=reupload" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=new" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then
            echo "version=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only app changes publish; tests/workflow-only pushes just build.
          publish=true
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" \
                 | grep -qE '^(src/|packaging/|assets/|requirements)'; then
              publish=false
            fi
          fi
          # Only the subject line counts, so a commit body may mention the flag.
          subject="${MESSAGE%%$'\n'*}"
          case "$subject" in *"[skip release]"*) publish=false ;; esac
          base="v$(TZ=Asia/Taipei date +%Y.%m.%d)"
          n=$(git tag -l "$base" "$base.*" | wc -l)
          if [ "$n" -eq 0 ]; then version="$base"; else version="$base.$((n + 1))"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version (publish=$publish)"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            exe: ESEManager.exe
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: ESEManager
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt's xcb platform plugin needs these at runtime (also used for the smoke test).
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libegl1

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Stamp version
        run: printf 'VERSION = "%s"\n' "$VERSION" > src/app_version.py

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/ESEManager.spec

      - name: Add databases and docs
        run: |
          out=dist/ESEManager
          cp README.md README.zh-TW.md "$out/"
          python scripts/fetch_release_dbs.py "$out"
          ls -la "$out"

      - name: Smoke test
        # Run from a copy: the app creates config.toml / Downloads next to the exe.
        run: |
          cp -r dist/ESEManager "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          # Builds the real main window offscreen; any startup error exits non-zero.
          QT_QPA_PLATFORM=offscreen ./${{ matrix.exe }} --selftest
          # Command-line mode: a real (small) request to GitHub Pages.
          if [ "$RUNNER_OS" = "Windows" ]; then cli=./ESEManager-cli.exe; else cli=./ESEManager-cli; fi
          "$cli" --version
          "$cli" status --lang en
          # Start the GUI headless; it should still be running after 20s (timeout -> 124).
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 ./${{ matrix.exe }}
          rc=$?
          set -e
          echo "GUI exit code: $rc"
          test "$rc" = "124"

      - name: Package
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            name="ESEManager_${VERSION}_${{ matrix.platform }}.7z"
            (cd dist && 7z a -t7z -mx=9 "../$name" ESEManager > /dev/null)
          else
            name="ESEManager_${VERSION}_${{ matrix.platform }}.tar.gz"
            tar -C dist -czf "$name" ESEManager
          fi
          sha256sum "$name" > "$name.sha256"
          ls -la "$name" "$name.sha256"
          mkdir -p out && mv "$name" "$name.sha256" out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          retention-days: 7

  publish:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MODE: ${{ needs.version.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets-out
          merge-multiple: true
      - name: Publish
        run: |
          set -euo pipefail
          ls -la assets-out
          if [ "$MODE" = "reupload" ]; then
            gh release upload "$VERSION" assets-out/* --clobber
            exit 0
          fi
          git fetch --tags --force --quiet
          prev=$(git tag -l 'v*' --sort=-creatordate | head -n 1)
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$GITHUB_SHA" | grep -v '\[skip release\]' || true
            else
              git log --no-merges --pretty='- %s' -n 20 "$GITHUB_SHA"
            fi
            echo
            echo "## Download"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Windows 10/11 x64 | \`ESEManager_${VERSION}_windows-x86_64.7z\` |"
            echo "| Linux x86_64 (glibc 2.35+) | \`ESEManager_${VERSION}_linux-x86_64.tar.gz\` |"
            echo
            echo "Command-line mode: \`ESEManager-cli --help\` (same folder)."
            echo
            echo "Each file has a \`.sha256\`. Extract over your existing folder to keep settings,"
            echo "databases and downloads. The app tells you in its status bar when a newer"
            echo "release is available."
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$VERSION"
            fi
          } > notes.md
          cat notes.md
          gh release create "$VERSION" assets-out/* --target "$GITHUB_SHA" \
            --title "ESEManager $VERSION" --notes-file notes.md --latest
